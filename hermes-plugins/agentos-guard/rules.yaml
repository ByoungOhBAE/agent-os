# agentos-guard rules. One block per role. Evaluated by __init__.py.
#
# Semantics
#   tools.deny             : tool names always blocked for this role
#   skill_manage.deny_actions : skill_manage actions blocked
#   write.any_ext_paths    : globs where ANY file type may be written (scratch for curl bodies, evidence)
#   write.allow_paths      : otherwise write_file/patch paths must match one of these globs (empty = any)
#   write.deny_ext         : extensions blocked outside any_ext_paths
#   terminal.*             : each pipeline segment (split on | && || ; newline, quotes/heredocs respected)
#                            is checked on its SHAPE — quoted strings and heredoc bodies are blanked first,
#                            so payload text (a comment mentioning "npm") never triggers a rule.
#     deny                 : regex that must NOT match the shape (deny wins)
#     allow                : shape must match at least one (empty list = any)
#     inline_python_guard  : python -c "<code>" is allowed unless the code spawns/writes (see _PY_DANGER)
#     redirect_guard       : `> file` / `>> file` only into scratch, Temp, $TMPDIR or *-evidence folders
#     (shell -c / powershell -Command / wsl -- … are always refused: they would smuggle a new command line)
#   budget.max_tool_calls  : per session_id; when exceeded every tool call is blocked
# mode (warn|block) and role come from config.yaml:
#   plugins.entries.agentos-guard.settings: { role: chief, mode: warn }

version: 4

# Human-readable issue titles. Enforced for roles with `check_issue_title: true` whenever they create/rename an
# issue via curl (inline -d, heredoc, @file body) or write a JSON body containing "title".
issue_title:
  separator: "›"
  min_parts: 2
  max_parts: 3
  leaf_min_chars: 8
  leaf_max_chars: 40
  example: "홈페이지 › 가을 발효 클래스 인스타 홍보문구 1개 작성"
  skip_prefixes: ["[보관]"]
  action_words: [작성, 구현, 검증, 분석, 정리, 설계, 수정, 조사, 비교, 시험, 보고, 설정, 배포, 검수, 제작, 개선, 추가, 삭제, 이전, 교체, 점검, 확인, 통합, 분리, 준비, 생성, 정의, 계획, 리뷰, 평가, 측정, 번역, 요약, 문서화, 자동화, 복구]
  action_suffixes: [하기, 만들기, 고치기, 옮기기, 찾기, 바꾸기]
  forbidden_patterns:
    - '-\d+\s*$'                                 # 순번 접미사 (검수봇-1)
    - '^(요청|테스트|시험|작업|task|test)\s*[:：]?\s*$'
    - '^\s*(요청|task)\s*[:：]'

# Evidence gate. Roles with `check_done_comment: true` may only move an issue to `done` with a comment carrying
# these labels (curl -d / heredoc / @file body, or a write_file JSON body). `check_reject_comment: true` (reviewer)
# requires the reject labels on `in_progress` + comment. Format only — truth of the evidence is the reviewer's job.
issue_comment:
  min_value_chars: 3
  done:
    labels:
      - [한 일, Done, 변경]
      - [확인 방법, Verified, 검증 방법]
      - [증거, Evidence]
      - [남은 일, Remaining, 남은 것]
    optional_empty: [남은 일]
    evidence_label: 증거
    evidence_pattern: 'https?://|[A-Za-z]:[\\/]|(^|\s|`)[\w.-]+[/\\][\w./\\-]+|\b[0-9a-f]{7,40}\b|\b(rev(ision)?|commit|#)\s*[:#]?\s*[\w-]{4,}'
    method_label: 확인 방법
    method_bad_patterns:
      - '^(확인|검증|테스트|검토)\s*(했|함|완료|됨|됐)[^\n]{0,6}$'   # "확인했습니다" 만 있고 절차가 없음
      - '^(ok|done|passed|verified)\.?$'
    forbidden_patterns:
      - '비슷하게'
      - '대략'
      - '아마도?'
      - '될\s*것\s*(같|입니다)'
      - '한\s*것\s*같'
    example: |
      ## 완료
      - 한 일: <무엇을 바꿨나, 1~3줄>
      - 확인 방법: <어떤 명령/절차로 확인했나>
      - 증거: <경로 · URL · commit · revision 중 1개 이상>
      - 남은 일: <없음 | 항목>
      (3회 연속 차단되면 사장님께 보고하세요.)
  reject:
    labels:
      - [위치, Location]
      - [위반 기준, Criterion, 기준]
      - [수정안, Fix, 조치]
    example: |
      ## 반려 #<n>
      - 위치: <파일:줄 | URL | 문단>
      - 위반 기준: <완료 기준 항목 또는 규칙>
      - 수정안: <구체 조치>

roles:
  chief:
    check_issue_title: true
    check_done_comment: true
    tools:
      deny: [execute_code, code_execution]
    skill_manage:
      deny_actions: [create, patch, write_file, remove_file, delete]
    write:
      any_ext_paths:                             # request bodies for curl, evidence snapshots
        - "**/cache/scratch/**"
        - "**/Temp/**"
        - "**/workspace/**-evidence/**"
      allow_paths:
        - "**/workspace/**/*.md"
        - "**/workspace/**/*.txt"
        - "**/plans/**/*.md"
      deny_ext: [.py, .mjs, .cjs, .js, .ts, .tsx, .jsx, .json, .yaml, .yml, .toml, .sh, .ps1, .bat, .cmd, .sql, .env, .ini, .cfg]
    terminal:
      inline_python_guard: true
      redirect_guard: true                       # > file only into scratch/Temp/-evidence
      allow:
        - '^curl\b'                                # Paperclip API
        - '^node(\.exe)?\s+[^|;&<>]*hermes-bots\.mjs"?\s+(hire|list|status|probe|sync-soul|baseline|compare|verify|leak-scan|check-chief|help)\b'
        - '^(\S*/)?hermes(\.exe)?\s+(-p\s+\S+\s+)?(mcp\s+(catalog|list)|profile\s+list|skills\s+list|status)\b'   # read-only Hermes CLI
        - '^node\s+.*setup-chief-single-window\.mjs"?(\s|$)'
        - '^git(\s+-C\s+("[^"]*"|\S+))?\s+(status|log|diff|show|branch|rev-parse|stash\s+(list|show))\b'
        - '^(ls|dir|cat|type|head|tail|wc|rg|grep|find|pwd|echo|printf|date|whoami|hostname|jq|sort|uniq|cut|tr|awk|sed|cd)\b'
        - '^(export\s+)?[A-Za-z_][A-Za-z0-9_]*=' # variable assignment lines (RUN=…; ISSUE=…)
        - '^(paperclipai|paperclip)\s+\S*\s*(list|get|show|status|view)\b'
      deny:
        - '\b(npm|npx|pnpm|yarn|pip3?|uv|poetry|cargo|go|docker|docker-compose|ssh|scp|rsync|sudo)\b'
        - '\bgit(\s+-C\s+("[^"]*"|\S+))?\s+(commit|push|pull|fetch|checkout|switch|merge|rebase|reset|stash(?!\s+(list|show))|add|rm|mv|tag|cherry-pick|revert|clean)\b'
        - '\b(rm|rmdir|del|erase|mv|move|cp|copy|mkdir|touch|chmod|chown|tee)\b'
        - '\bsed\s+-i\b'
        - '\bpython3?\s+(?!-c)\S+\.py\b'
        - '\bnode\s+(?!.*(hermes-bots|setup-chief-single-window)\.mjs)("[^"]*"|\S+)\.(m?js|cjs|ts)\b'
    budget:
      max_tool_calls: 120

  reviewer:
    check_done_comment: true
    check_reject_comment: true
    tools:
      deny: [delegate_task, execute_code, code_execution]
    skill_manage:
      deny_actions: [create, patch, write_file, remove_file, delete]
    write:
      any_ext_paths:
        - "**/cache/scratch/**"
        - "**/Temp/**"
        - "**/workspace/review-evidence/**"
      allow_paths:
        - "**/workspace/**/review-*.md"
      deny_ext: []
    terminal:
      inline_python_guard: true
      redirect_guard: true
      allow:
        - '.*'                                     # default allow; deny list below carries the policy
      deny:
        - '\bgit(\s+-C\s+("[^"]*"|\S+))?\s+(commit|push|pull|checkout|switch|merge|rebase|reset|stash(?!\s+(list|show))|add|rm|mv|tag|cherry-pick|revert|clean|apply)\b'
        - '\b(rm|rmdir|del|erase|mv|move|cp|copy|chmod|chown|tee)\b'
        - '\bsed\s+-i\b'
        - '\b(npm|pnpm|yarn)\s+(install|i|add|remove|uninstall|publish|link|update)\b'
        - '\b(pip3?|uv)\s+(install|uninstall)\b'
        - '\b(docker|docker-compose|ssh|scp|rsync|sudo)\b'
        - '\bnode\s+.*hermes-bots\.mjs"?\s+(hire|convert|archive|sync-soul|guard)\b'
    budget:
      max_tool_calls: 200

  worker:
    check_done_comment: true
    # Strict issue calls: issue keys (HER-38) and ?query tails count as issue URLs; a body the gate cannot read
    # ($VAR, $(…), @file made earlier in the same command) is refused; non-curl HTTP clients to the API are refused;
    # status transitions inside programs are refused (also unquoted JS keys, heredoc programs, script files).
    strict_issue_calls: true
    # Minimal hard stops — irreversible or outside the worker's own lane. Paths are regex on the lowercased,
    # forward-slash, cd/$VAR-resolved path.
    protect:
      write_paths:
        - '/hermes/profiles/[^/]+/(config\.yaml|soul\.md|\.env|auth\.json)$'
        - '/hermes/(config\.yaml|soul\.md|\.env|auth\.json)$'
        - '/plugins/agentos-guard(/|$)'
        - '/hermes-plugins/agentos-guard(/|$)'
        - '(^|/)\.git(/|$)'
      read_basenames:
        - '^\.env$'
        - '^\.env\.(?!example$|sample$|template$)[\w.-]+$'
        - '^auth\.json$'
        - '^\.git-credentials$'
        - '^credentials?(\.json)?$'
        - '^id_(rsa|ed25519|ecdsa)$'
      other_profiles: true        # no writes into another bot's profile folder
      skills_own_only: true       # skill_manage only on skills under this bot's own profile
      secret_values: true         # refuse any tool call carrying a literal value from this bot's .env (*KEY/TOKEN/SECRET)
    tools:
      deny: []
    skill_manage:
      deny_actions: []
    write:
      any_ext_paths: []
      allow_paths: []
      deny_ext: []
    terminal:
      inline_python_guard: false
      allow: ['.*']
      deny:
        - '\brm\s+(-\w+\s+)*-\w*[rR]'                  # rm -r / -rf / -fr …
        - '\b(Remove-Item|ri|rd|rmdir)\b.*\s-(Recurse|r)\b'
        - '\b(rmdir|rd)\s+/s\b'
        - '\bdel\s+(/\w\s+)*/s\b'
        - '\bgit\s+(-C\s+("[^"]*"|\S+)\s+)?push\b.*(\s--force(-with-lease)?\b|\s-f\b|\s\+\S)'
        - '\bgit\s+(-C\s+("[^"]*"|\S+)\s+)?reset\s+.*--hard\b'
        - '\bgit\s+(-C\s+("[^"]*"|\S+)\s+)?clean\s+(-\w*\s+)*-\w*f'
        - '\bgit\s+(-C\s+("[^"]*"|\S+)\s+)?(checkout|restore)\s+(--\s+)?\.(\s|$)'
        - '\bgit\s+(-C\s+("[^"]*"|\S+)\s+)?branch\s+(-\w+\s+)*-D\b'
        - '\bhermes(\.exe)?\s+(-p\s+\S+\s+)?(config\s+(set|edit|reset)|plugins?\b|auth\s+(add|remove|reset|logout)|profile\s+(delete|create|rename)|gateway\s+(stop|restart|uninstall)|update\b)'
        - '\bnode\s+.*hermes-bots\.mjs"?\s+(convert|archive|sync-soul|guard)\b'   # hire stays open: the code bot tests the hire gate
        - '\b(drop\s+(table|database)|truncate\s+table)\b'
        # dumping secrets into the transcript: printenv / env / set, echo of a *KEY/*TOKEN variable
        - '^(printenv|env|set|export\s+-p|Get-ChildItem\s+env:|gci\s+env:|dir\s+env:)\s*$'
        - '^(echo|printf|print|Write-Output|Write-Host)\b.*\$(\{(env:)?\w*(KEY|TOKEN|SECRET|PASSWORD)\w*(?!:?\+)[^}]*\}|(env:)?\w*(KEY|TOKEN|SECRET|PASSWORD)\w*\b(?!\}))'
    budget:
      max_tool_calls: 400
